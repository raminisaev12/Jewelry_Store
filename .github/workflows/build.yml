name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flet
      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          project-name: AlmazPath
          main-file: telefon.py
          build-command: flet build apk
