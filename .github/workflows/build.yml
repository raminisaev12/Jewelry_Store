name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practica 1.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pymysql python-docx

      - name: Build APK (initial)
        run: |
          echo y | flet build apk --module-name telefon

      - name: Replace app name in AndroidManifest
        run: |
          MANIFEST=$(find build/ -name AndroidManifest.xml -path "*/src/main/*" | head -n 1)
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Алмазный путь"/g' "$MANIFEST"
            echo "Manifest updated: $MANIFEST"
          else
            echo "Manifest not found!"
            exit 1
          fi

      - name: Rebuild APK with custom name (Gradle)
        run: |
          cd build/flutter/android
          chmod +x gradlew
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export JAVA_HOME=$JAVA_HOME_17_X64
          # Добавляем переменную, которую требует serious_python
          export SERIOUS_PYTHON_SITE_PACKAGES=$(find ../python -type d -name site-packages | head -n 1 | xargs realpath)
          echo "SITE_PACKAGES=$SERIOUS_PYTHON_SITE_PACKAGES"
          ./gradlew assembleRelease
          cd ../../..
          mkdir -p final_apk
          cp build/flutter/android/app/build/outputs/flutter-apk/app-release.apk final_apk/almaz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaz-apk
          path: Practica 1.0/final_apk/almaz.apk
