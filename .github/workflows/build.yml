name: Build APK with Custom Name
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practica 1.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pymysql python-docx

      - name: Build APK (standard)
        run: |
          echo y | flet build apk --module-name telefon

      - name: Rename app in APK
        run: |
          # Инструменты
          sudo apt-get update -qq && sudo apt-get install -y -qq zipalign

          ORIG_APK=$(ls build/apk/*.apk | head -n 1)
          echo "Original APK: $ORIG_APK"

          # Распаковываем APK как zip
          mkdir apk_content
          unzip -q "$ORIG_APK" -d apk_content
          rm -rf apk_content/META-INF  # старая подпись

          # Конвертируем бинарный манифест в текст и меняем название
          AAPT=/usr/local/lib/android/sdk/build-tools/34.0.0/aapt
          $AAPT d xmltree apk_content/AndroidManifest.xml > manifest.txt
          sed -i 's/\(android:label\)="[^"]*"/\1="Алмазный путь"/' manifest.txt
          
          # Создаём новый бинарный манифест
          $AAPT p -M manifest.txt -S dummy -I /usr/local/lib/android/sdk/platforms/android-34/android.jar -F new-manifest.apk
          unzip -q -o new-manifest.apk AndroidManifest.xml -d apk_content

          # Упаковываем обратно в APK
          cd apk_content && zip -qr ../repacked.apk . && cd ..

          # Выравниваем и подписываем
          zipalign -p 4 repacked.apk aligned.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android aligned.apk

          mkdir final_apk
          mv aligned.apk final_apk/almaz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaz-apk
          path: Practica 1.0/final_apk/almaz.apk
