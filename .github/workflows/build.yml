name: Build APK with Custom Name
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practica 1.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pymysql python-docx

      - name: Build, patch manifest and rebuild APK
        run: |
          # Первая сборка – создаст Flutter проект и установит Flutter SDK
          echo y | flet build apk --module-name telefon

          # Находим AndroidManifest.xml и меняем название
          MANIFEST=$(find build/flutter -name AndroidManifest.xml -path "*/src/main/*" | head -n 1)
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Алмазный путь"/g' "$MANIFEST"
            echo "Manifest updated: $MANIFEST"
          fi

          # Добавляем Flutter в PATH (он уже установлен в $HOME/.flet/flutter)
          export PATH="$HOME/.flet/flutter/flutter/bin:$PATH"

          # Находим site-packages для переменной SERIOUS_PYTHON_SITE_PACKAGES
          export SERIOUS_PYTHON_SITE_PACKAGES=$(find build/flutter/python -type d -name site-packages | head -n 1 | xargs realpath)
          echo "SITE_PACKAGES=$SERIOUS_PYTHON_SITE_PACKAGES"

          # Пересобираем APK с изменённым манифестом
          cd build/flutter
          flutter build apk --release
          cd ../../

          # Копируем готовый APK в final_apk
          mkdir -p final_apk
          cp build/flutter/build/app/outputs/flutter-apk/app-release.apk final_apk/almaz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaz-apk
          path: Practica 1.0/final_apk/almaz.apk
