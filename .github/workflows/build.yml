name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practica 1.0
    steps:
      - uses: actions/checkout@v4

      - name: Show files (for debug)
        run: ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pymysql python-docx

      - name: Build APK (initial)
        run: |
          echo y | flet build apk --module-name telefon

      - name: Replace app name in manifest
        run: |
          MANIFEST=$(find . -name AndroidManifest.xml -path "*/src/main/*" | head -n 1)
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Алмазный путь"/g' "$MANIFEST"
            echo "Manifest updated: $MANIFEST"
          else
            echo "Manifest not found!"
            exit 1
          fi

      - name: Rebuild APK with custom name
        run: |
          cd build/flutter
          $HOME/flutter/bin/flutter build apk --release
          mkdir -p ../../final_apk
          cp build/app/outputs/flutter-apk/app-release.apk ../../final_apk/almaz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaz-apk
          path: Practica 1.0/final_apk/almaz.apk
